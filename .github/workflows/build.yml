name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev libssl-dev libffi-dev libxml2-dev libxslt1-dev zlib1g-dev openjdk-17-jdk

    - name: Build with Buildozer
      uses: ArtemSydoryk/buildozer-action@v1.2
      with:
        command: buildozer android debug
        submodule: false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

